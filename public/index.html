<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Premier Lig — Tahmin Oyunu</title>
  <style>
:root{
  --bg:#f4f4f8; --card:#ffffff; --soft:#f7f5fb; --line:#e9e8f1;
  --ink:#1c1930; --muted:#8a889c; --pri:#3d195b; --pri-d:#2a0f43; --pri2:#e90052;
  --chip:#f0eaf7; --ok:#12a05c; --danger:#e23155; --warn:#e08a00; --gold:#b8860b;
  --radius:14px; --shadow:0 2px 12px rgba(28,25,48,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.lion{width:40px;height:40px;flex:none}

/* ---------- Auth ---------- */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 50px rgba(61,25,91,.14)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand h1{font-size:23px;letter-spacing:.2px;color:var(--pri);line-height:1.05}
.brand-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:700;font-size:15px}
.tab.active{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form input{background:#fff;border:1px solid var(--line);color:var(--ink);padding:13px 14px;border-radius:10px;font-size:15px}
.auth-form input:focus{outline:none;border-color:var(--pri2)}
.btn-primary{background:linear-gradient(90deg,var(--pri2),#a3178f);color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:16px}
.btn-primary:active{transform:translateY(1px)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;text-align:center;margin-top:4px}
.auth-msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.auth-msg.err{color:var(--danger)}
.auth-msg.ok{color:var(--ok)}
.foot-note{color:var(--muted);font-size:12px;text-align:center}

/* ---------- Topbar ---------- */
.app{max-width:960px;margin:0 auto;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar-brand{display:flex;align-items:center;gap:10px}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-weight:900;font-size:18px;color:var(--pri);letter-spacing:.2px}
.brand-season{font-size:11px;color:var(--muted)}
.nav{display:flex;gap:6px;flex:1;overflow-x:auto;padding:2px}
.nav button{background:#fff;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:700;white-space:nowrap}
.nav button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.topbar-right{display:flex;align-items:center;gap:10px}
.balance{background:linear-gradient(90deg,#3d195b,#5a2580);color:#fff;font-weight:800;padding:7px 13px;border-radius:20px;font-size:13.5px}
.user-chip{color:var(--muted);font-size:13px}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:9px;font-size:13px}

/* ---------- View ---------- */
.view{padding:16px}
.section-title{font-size:15px;font-weight:800;margin:6px 2px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--ink)}
.section-title small{color:var(--muted);font-weight:500;font-size:12px}

/* ---------- Takim armasi ---------- */
.crest{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;flex:none;letter-spacing:.2px}

/* ---------- Mac karti ---------- */
.match{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.fixture{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.teams-col{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.team-row{display:flex;align-items:center;gap:9px}
.team-name{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kick{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;line-height:1.35;padding-left:8px;border-left:1px solid var(--line)}
.kick b{display:block;color:var(--ink);font-weight:700}
.market{margin-top:12px}
.market-label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.odds-row{display:grid;gap:8px}
.odds-row.c3{grid-template-columns:repeat(3,1fr)}
.odds-row.c2{grid-template-columns:repeat(2,1fr)}
.odd-btn{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;color:var(--ink);transition:.12s}
.odd-btn:hover{border-color:var(--pri2);background:#fff}
.odd-btn .k{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.odd-btn .v{font-weight:800;font-size:15px;color:var(--pri)}
.odd-btn.disabled{opacity:.4;pointer-events:none}

/* ---------- Kupon / listeler ---------- */
.coupon{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.coupon.won{border-left-color:var(--ok)}
.coupon.lost{border-left-color:var(--danger)}
.coupon.pending{border-left-color:var(--warn)}
.coupon.void{border-left-color:var(--muted)}
.coupon-top{display:flex;justify-content:space-between;gap:10px}
.coupon-teams{font-weight:700;font-size:14px;color:var(--ink)}
.coupon-pick{color:var(--pri2);font-size:13px;margin-top:3px}
.coupon-meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.coupon-meta b{color:var(--ink)}
.status-badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;height:fit-content}
.status-badge.won{background:#e4f6ec;color:var(--ok)}
.status-badge.lost{background:#fce4ea;color:var(--danger)}
.status-badge.pending{background:#fdf1dd;color:var(--warn)}
.status-badge.void{background:#eeeef4;color:var(--muted)}

/* ---------- Kullanici listesi ---------- */
.user-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.user-row:hover{border-color:var(--pri2);cursor:pointer}
.user-left{display:flex;align-items:center;gap:12px}
.rank{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--pri)}
.rank.gold{background:#fbeecb;color:var(--gold)}
.uname{font-weight:700;font-size:14px;color:var(--ink)}
.admin-tag{font-size:10px;background:#f3e0f0;color:var(--pri2);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.ubalance{color:var(--pri);font-weight:800;font-size:14px}

/* ---------- Admin / kartlar ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin-bottom:12px;color:var(--ink)}
.row-actions{display:flex;gap:8px}
.btn-sm{border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700}
.btn-ok{background:var(--ok);color:#fff}
.btn-no{background:var(--danger);color:#fff}
.btn-blue{background:var(--pri);color:#fff}
.pending-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pending-row:last-child{border-bottom:0}
.admin-tools{display:flex;gap:8px;flex-wrap:wrap}
.settle-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.settle-form input{width:52px;background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px;border-radius:8px;text-align:center}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(28,25,48,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:22px 20px 30px;position:relative;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;background:var(--soft);border:0;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:15px}
.bet-teams{font-weight:800;font-size:16px;margin-bottom:2px;color:var(--ink)}
.bet-pick{color:var(--pri2);font-size:14px;margin-bottom:16px}
.bet-field{margin-bottom:14px}
.bet-field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.bet-field input{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);padding:13px;border-radius:10px;font-size:16px}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:8px;border-radius:8px;font-size:13px}
.bet-summary{display:flex;justify-content:space-between;background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.bet-summary b{color:var(--pri);font-size:16px}

/* ---------- Genel ---------- */
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.spinner{text-align:center;color:var(--muted);padding:30px}
.foot-tz{color:var(--muted);font-size:11.5px;text-align:center;margin-top:14px;font-style:italic}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:100;box-shadow:0 8px 30px rgba(28,25,48,.3);max-width:90%;text-align:center}
.toast.err{background:var(--danger)}
.info-banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.disclaimer{background:#fef3f6;border:1px solid #f6d3de;color:#9c2c4a;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.5;margin-bottom:14px;text-align:center}
.disclaimer b{color:#7a1f38}

/* ---------- Oyun Kurallari karti ---------- */
.rules-card{background:#f7f3fc;border:1px solid #e4d7f3;border-radius:12px;padding:12px 15px;margin-bottom:16px}
.rules-head{font-weight:700;color:var(--pri);font-size:14px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.rules-head::-webkit-details-marker{display:none}
.rules-head::after{content:'▾';color:var(--pri);font-size:13px;transition:transform .2s}
.rules-card[open] .rules-head::after{transform:rotate(180deg)}
.rules-card[open] .rules-head{margin-bottom:6px}
.rules-sub{font-weight:700;color:var(--pri2);font-size:12px;text-transform:uppercase;letter-spacing:.3px;margin:10px 0 4px}
.rules-list{margin:0;padding-left:22px;color:#3d2a52;font-size:13px;line-height:1.6}
.rules-list li{margin-bottom:5px}
.rules-list li:last-child{margin-bottom:0}
.rules-list b{color:var(--pri)}

/* ---------- Elenme (Kaybetti) rozeti ---------- */
.elim-tag{display:inline-block;background:#fdecec;color:#c0392b;border:1px solid #f3c6c6;border-radius:6px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:6px;vertical-align:middle}
.user-elim{opacity:.62}
.user-elim .ubalance{color:#c0392b}

/* ---------- Kompakt mac satiri (tiklanabilir) ---------- */
.match-lite{cursor:pointer;transition:.12s}
.match-lite:hover{border-color:var(--pri2);box-shadow:0 4px 16px rgba(61,25,91,.1)}
.match-lite .fixture{position:relative}
.chev{color:var(--muted);font-size:26px;line-height:1;margin-left:4px;font-weight:400}
.lite-ms{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ms-pill{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:800;font-size:14px;color:var(--pri)}
.ms-pill i{color:var(--muted);font-style:normal;font-weight:600;font-size:12px}
.ms-more{margin-left:auto;color:var(--pri2);font-size:12.5px;font-weight:700;white-space:nowrap}

/* ---------- Basladi / CANLI rozeti ---------- */
.match-live{cursor:default}
.live-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.live-badge{display:inline-flex;align-items:center;gap:7px;background:#fce4ea;color:var(--danger);font-weight:800;font-size:12.5px;letter-spacing:.4px;padding:5px 12px;border-radius:20px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.2s infinite}
.live-note{color:var(--muted);font-size:12px}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}100%{opacity:1;transform:scale(1)}}

/* ---------- Oran paneli (asagidan kayan) ---------- */
.modal-box.tall{max-height:88vh;overflow-y:auto}
.panel-head{display:flex;align-items:center;gap:12px;padding-right:34px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.panel-head .teams-col{flex:1;display:flex;flex-direction:column;gap:8px}

/* ---------- Acilir-kapanir bahis gruplari ---------- */
.mgroup{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.mgroup-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--soft);border:0;padding:13px 14px;font-size:14px;font-weight:800;color:var(--pri);cursor:pointer}
.mg-ico{color:var(--muted);font-size:13px;transition:transform .18s}
.mgroup.open .mg-ico{transform:rotate(180deg)}
.mgroup-body{display:none;padding:6px 12px 12px}
.mgroup.open .mgroup-body{display:block}
.mgroup-body .market:first-child{margin-top:6px}

/* Masaustunde sekme ikonlari gizli (sadece yazi) */
.nav button .ic{display:none}

/* ---------- MOBIL: sekmeler alta sabit menu (web gorunumu degismez) ---------- */
@media (max-width:640px){
  .topbar{flex-wrap:nowrap;gap:8px;padding:10px 12px;backdrop-filter:none;-webkit-backdrop-filter:none}
  .topbar-brand{flex:1;min-width:0}
  .brand-name{font-size:16px}
  .user-chip{display:none}
  .balance{font-size:12.5px;padding:6px 11px}

  #nav{
    position:fixed;left:0;right:0;bottom:0;top:auto;flex:none;
    display:flex;justify-content:space-around;gap:0;overflow:visible;
    background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -4px 16px rgba(28,25,48,.07);z-index:40;
    padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }
  #nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:transparent;border:0;border-radius:10px;padding:5px 2px;color:var(--muted);font-weight:600;
  }
  #nav button.active{background:transparent;color:var(--pri)}
  #nav button .ic{display:block;font-size:19px;line-height:1}
  #nav button .lb{font-size:10.5px;white-space:nowrap}

  .app{padding-bottom:74px}
  .toast{bottom:84px}
}

</style>
</head>
<body>
  <!-- Aslan amblemi (ozgun tasarim, tekrar kullanilir) -->
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="lion" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="49" fill="#3d195b"/>
      <circle cx="50" cy="50" r="42" fill="#ffffff" opacity=".14"/>
      <g fill="#f2a63b">

        <circle cx="50" cy="20" r="11"/><circle cx="65" cy="24.02" r="11"/><circle cx="75.98" cy="35" r="11"/>
      </g>
      <circle cx="34" cy="30" r="9" fill="#e58f2a"/><circle cx="66" cy="30" r="9" fill="#e58f2a"/>

      <circle cx="50" cy="52" r="27" fill="#f6c56b"/>

    </symbol>
  </defs></svg>

  <!-- Giris / Kayit ekrani -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="brand">
        <svg class="lion"><use href="#lion"/></svg>
        <div>
          <h1>Premier Lig</h1>
          <p class="brand-sub">Arkadaşlar arası eğlence oyunu · 2026-2027</p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-auth-tab="login">Giriş</button>
        <button class="tab" data-auth-tab="register">Kayıt Ol</button>
      </div>

      <form id="login-form" class="auth-form">
        <input name="username" placeholder="Kullanıcı adı" autocomplete="username" required />
        <input name="password" type="password" placeholder="Şifre" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Giriş Yap</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input name="username" placeholder="Kullanıcı adı (en az 3 karakter)" required />
        <input name="password" type="password" placeholder="Şifre (en az 4 karakter)" required />
        <button type="submit" class="btn-primary">Kayıt Ol</button>
        <p class="hint">Kayıt sonrası hesabın <b>admin onayı</b> bekler. Onaylanınca giriş yapabilirsin.</p>
      </form>

      <div id="auth-msg" class="auth-msg"></div>
    </div>
    <p class="foot-note">🎮 Yalnızca arkadaşlar arası eğlence amaçlıdır · Gerçek para yoktur · <b>ASCU</b> sanal puandır · Bahis/kumar değildir</p>
  </div>

  <!-- Ana uygulama -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <svg class="lion"><use href="#lion"/></svg>
        <div class="brand-txt">
          <span class="brand-name">Premier Lig</span>
          <span class="brand-season">2026-2027</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="topbar-right">
        <span class="balance" id="balance">—</span>
        <span class="user-chip" id="user-chip"></span>
        <button class="btn-ghost" id="logout-btn">Çıkış</button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>

  <!-- Mac oran paneli (asagidan kayar) -->
  <div id="match-modal" class="modal hidden">
    <div class="modal-box tall">
      <button class="modal-close" id="match-close">✕</button>
      <div id="match-content"></div>
    </div>
  </div>

  <!-- Kupon paneli -->
  <div id="bet-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="bet-close">✕</button>
      <div id="bet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
'use strict';

// ---------- Yardimcilar ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Bir hata olustu');
  return data;
}

// Para birimi: ASCU (arkadaslarin bas harflerinden turetilmis SANAL puan; gercek para degildir)
function fmtTL(n) {
  return Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ASCU';
}
const TZ = 'Europe/Istanbul';
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: TZ });
}
function fmtKick(iso) {
  const d = new Date(iso);
  return {
    day: d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', timeZone: TZ }),
    time: d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', timeZone: TZ }),
  };
}

  'leicester': ['#003090', 'LEI'], 'liverpool': ['#C8102E', 'LIV'], 'luton': ['#F78F1E', 'LUT'],
  'manchester city': ['#6CABDD', 'MCI'], 'manchester united': ['#DA291C', 'MUN'], 'newcastle': ['#241F20', 'NEW'],
  'nottingham forest': ['#DD0000', 'NFO'], 'sheffield': ['#EE2737', 'SHU'], 'southampton': ['#D71920', 'SOU'],

  'coventry': ['#78D0F1', 'COV'],

function hashColor(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 55%, 42%)`;
}
function pickFg(bg) {
  if (bg.startsWith('#')) {
    const r = parseInt(bg.slice(1, 3), 16), g = parseInt(bg.slice(3, 5), 16), b = parseInt(bg.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.62 ? '#1c1930' : '#ffffff';
  }
  return '#ffffff';
}
function teamCrest(name) {
  const lower = (name || '').toLowerCase();
  for (const key of Object.keys(TEAM_COLORS)) {
    if (lower.includes(key)) {
      const [bg, code] = TEAM_COLORS[key];
      return { bg, fg: pickFg(bg), code };
    }
  }
  const words = lower.split(/\s+/).filter(Boolean);
  const code = (words.length >= 2 ? words[0][0] + words[1][0] + (words[0][1] || '') : (name || '').slice(0, 3)).toUpperCase();
  const bg = hashColor(lower);
  return { bg, fg: '#ffffff', code };
}
function crestEl(name) {
  const c = teamCrest(name);
  return `<span class="crest" style="background:${c.bg};color:${c.fg}">${c.code}</span>`;
}
function toast(msg, isErr = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  setTimeout(() => t.classList.add('hidden'), 2600);
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  try {
    await api('/login', { method: 'POST', body: { username: f.username.value, password: f.password.value } });

    setAuthMsg(err.message, true);

// ---------- Navigasyon ----------
const VIEWS = ['bulten', 'kuponlarim', 'kullanicilar', 'sonuclar'];
function buildNav() {
  const items = [
    ['bulten', 'Bülten', '⚽'],
    ['kuponlarim', 'Kuponlarım', '🧾'],
    ['kullanicilar', 'Oyuncular', '👥'],
    ['sonuclar', 'Sonuçlar', '🏁'],
  ];
  if (ME.is_admin) items.push(['admin', 'Admin', '⚙️']);
  $('#nav').innerHTML = items
    .map(([k, l, ic]) => `<button data-view="${k}"><span class="ic">${ic}</span><span class="lb">${l}</span></button>`)
    .join('');
  $$('#nav button').forEach((b) => b.addEventListener('click', () => render(b.dataset.view)));
}

function setActiveNav(view) {
  $$('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
}

// ---------- Baslangic ----------
async function boot() {
  const { user, config } = await api('/me');
  if (config) CONFIG = config;
  if (!user || user.status !== 'approved') {
    if (user && user.status === 'pending') setAuthMsg('Hesabınız henüz onaylanmadı.', true);
    $('#auth-screen').classList.remove('hidden');
    $('#app').classList.add('hidden');
    return;
  }
  ME = user;
  $('#auth-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#user-chip').textContent = ME.username + (ME.is_admin ? ' (admin)' : '');
  updateBalance(ME.balance);
  buildNav();
  render('bulten');
}

function updateBalance(b) {
  if (b != null) ME.balance = b;
  $('#balance').textContent = fmtTL(ME.balance);
}

async function refreshMe() {
  const { user } = await api('/me');
  if (user) updateBalance(user.balance);
}

// ---------- Render ----------
async function render(view) {
  setActiveNav(view);
  const el = $('#view');
  el.innerHTML = '<div class="spinner">Yükleniyor…</div>';
  try {
    if (view === 'bulten') await renderBulten(el);
    else if (view === 'kuponlarim') await renderKuponlarim(el);
    else if (view === 'kullanicilar') await renderKullanicilar(el);
    else if (view === 'sonuclar') await renderSonuclar(el);
    else if (view === 'admin') await renderAdmin(el);
  } catch (err) {
    el.innerHTML = `<div class="empty">Hata: ${err.message}</div>`;
  }
}

  const { matches } = await api('/matches');

    ['Oyuncu / Davranış Kuralları', [
      `Oyuncular birbirine ASCU borç veremez veya transfer edemez.`,
      `Sistemde açık aramak, hata (bug) ile bakiye artırmak veya başkasının hesabını kullanmak yasaktır.`,
      `Her oyuncu yalnızca kendi hesabından oynar.`,

  const disabled = odd ? '' : 'disabled';
  return `<div class="odd-btn ${disabled}" data-mid="${mid}" data-market="${market}" data-sel="${sel}">
    <span class="k">${label}</span><span class="v">${odd ? Number(odd).toFixed(2) : '-'}</span></div>`;
}

// Bultende kompakt mac satiri. Mac basladiysa oranlar yerine CANLI rozeti.
function matchCard(m) {
  const o = m.odds || {};
  const ms = o['1x2'] || {};
  const k = fmtKick(m.commence_time);
  const oneline = (v) => (v ? Number(v).toFixed(2) : '-');
  const started = new Date(m.commence_time).getTime() <= Date.now();

  const fixture = `
    <div class="fixture">
      <div class="teams-col">
        <div class="team-row">${crestEl(m.home_team)}<span class="team-name">${m.home_team}</span></div>
        <div class="team-row">${crestEl(m.away_team)}<span class="team-name">${m.away_team}</span></div>
      </div>
      <div class="kick"><b>${k.day}</b>${k.time}</div>
      ${started ? '' : '<span class="chev">›</span>'}
    </div>`;

  if (started) {
    return `<div class="match match-live">
      ${fixture}
      <div class="live-row">
        <span class="live-badge"><span class="live-dot"></span>CANLI</span>
        <span class="live-note">Maç başladı · bahisler kapandı</span>
      </div>
    </div>`;
  }

  return `<div class="match match-lite" data-mid="${m.id}">
    ${fixture}
    <div class="lite-ms">
      <span class="ms-pill"><i>1</i>${oneline(ms['1'])}</span>
      <span class="ms-pill"><i>X</i>${oneline(ms.X)}</span>
      <span class="ms-pill"><i>2</i>${oneline(ms['2'])}</span>
      <span class="ms-more">Tüm oranlar ›</span>
    </div>
  </div>`;
}

// Panelde gosterilecek tum bahis pazarlari (gruplu, acilir-kapanir)
function marketsHtml(m) {
  const o = m.odds || {};
  return MARKET_GROUPS.map((g) => {
    const inner = g.markets
      .map((mk) => {
        const mo = o[mk.key] || {};
        const btns = mk.sels.map(([sel, lab]) => oddBtn(m.id, mk.key, sel, lab, mo[sel])).join('');
        return `<div class="market"><div class="market-label">${mk.label}</div><div class="odds-row c${mk.cols}">${btns}</div></div>`;
      })
      .join('');
    return `<div class="mgroup ${g.open ? 'open' : ''}">
      <button type="button" class="mgroup-head">${g.title}<span class="mg-ico">▾</span></button>
      <div class="mgroup-body">${inner}</div>
    </div>`;
  }).join('');
}

let BULTEN_CACHE = {};
async function openBet(mid, market, sel) {
  const { matches } = await api('/matches');
  const m = matches.find((x) => x.id === mid);
  if (!m) return toast('Maç bulunamadı', true);
  const odd = m.odds && m.odds[market] && m.odds[market][sel];
  if (!odd) return toast('Oran mevcut değil', true);

  $('#bet-content').innerHTML = `
    <div class="bet-teams">${m.home_team} vs ${m.away_team}</div>
    <div class="bet-pick">${MARKET_LABELS[market]} · ${PICK_LABELS[market][sel]} · Oran ${Number(odd).toFixed(2)}</div>
    <div class="bet-field">
      <label>Bahis tutarı (ASCU) — Bakiye: ${fmtTL(ME.balance)} · Min. ${CONFIG.min_stake}</label>
      <input id="stake-input" type="number" min="${CONFIG.min_stake}" step="1" placeholder="En az ${CONFIG.min_stake}" inputmode="numeric" />
      <div class="quick">
        <button data-q="50">50</button><button data-q="100">100</button>
        <button data-q="250">250</button><button data-q="500">500</button>
      </div>
    </div>
    <div class="bet-summary"><span>Olası kazanç</span><b id="pot-win">0 ASCU</b></div>
    <button class="btn-primary" id="place-bet">Kuponu Onayla</button>`;

  const stakeInput = $('#stake-input');
  const potWin = $('#pot-win');
  const calc = () => {
    const s = Number(stakeInput.value) || 0;
    potWin.textContent = fmtTL(Math.round(s * odd * 100) / 100);
  };
  stakeInput.addEventListener('input', calc);
  $$('#bet-content .quick button').forEach((q) =>
    q.addEventListener('click', () => {
      stakeInput.value = q.dataset.q;
      calc();
    })
  );
  $('#place-bet').addEventListener('click', async () => {
    const stake = Number(stakeInput.value);
    if (!stake || stake <= 0) return toast('Geçerli bir tutar girin', true);
    if (stake < CONFIG.min_stake) return toast(`Minimum kupon tutarı ${CONFIG.min_stake} ASCU`, true);
    try {
      const r = await api('/coupons', { method: 'POST', body: { match_id: mid, market, selection: sel, stake } });
      updateBalance(r.balance);
      closeBet();
      toast('Kupon oluşturuldu! ✅');
    } catch (err) {
      toast(err.message, true);
    }
  });

  $('#bet-modal').classList.remove('hidden');
}
function closeBet() {
  $('#bet-modal').classList.add('hidden');
}
$('#bet-close').addEventListener('click', closeBet);
$('#bet-modal').addEventListener('click', (e) => {
  if (e.target.id === 'bet-modal') closeBet();
});
$('#match-close').addEventListener('click', closeMatchPanel);
$('#match-modal').addEventListener('click', (e) => {
  if (e.target.id === 'match-modal') closeMatchPanel();
});

// ----- Kuponlarim -----
async function renderKuponlarim(el) {
  const { coupons } = await api('/coupons/mine');
  if (!coupons.length) {
    el.innerHTML = '<div class="empty">Henüz kupon yapmadın. Bülten\'den bir maç seç!</div>';
    return;
  }
  el.innerHTML = `<div class="section-title">Kuponlarım <small>${coupons.length} kupon</small></div>` + coupons.map(couponCard).join('');
}

function couponCard(c) {
  const st = c.status;
  const score = c.status !== 'pending' && c.home_score != null ? ` · Skor: ${c.home_score}-${c.away_score}` : '';
  return `<div class="coupon ${st}">
    <div class="coupon-top">
      <div>
        <div class="coupon-teams">${c.home_team} vs ${c.away_team}</div>
        <div class="coupon-pick">${MARKET_LABELS[c.market]} · ${PICK_LABELS[c.market][c.selection]} @ ${Number(c.odd).toFixed(2)}</div>
      </div>
      <span class="status-badge ${st}">${STATUS_LABELS[st]}</span>
    </div>
    <div class="coupon-meta">
      <span>Bahis: <b>${fmtTL(c.stake)}</b></span>
      <span>Olası: <b>${fmtTL(c.potential_win)}</b></span>
      <span>${fmtDate(c.commence_time)}${score}</span>
    </div>
  </div>`;
}

// ----- Kullanicilar -----
async function renderKullanicilar(el) {
  const { users } = await api('/users');
  el.innerHTML =
    `<div class="section-title">Oyuncular <small>bakiyeye göre sıralı</small></div>` +
    users
      .map((u, i) => {
        const goldRank = i === 0 ? 'gold' : '';
        const elim = u.eliminated ? '<span class="elim-tag">Kaybetti</span>' : '';
        return `<div class="user-row${u.eliminated ? ' user-elim' : ''}" data-uid="${u.id}">
          <div class="user-left">
            <div class="rank ${goldRank}">${i + 1}</div>
            <div class="uname">${u.username}${u.is_admin ? '<span class="admin-tag">admin</span>' : ''}${elim}${u.id === ME.id ? ' <span style="color:var(--muted);font-size:12px">(sen)</span>' : ''}</div>
          </div>
          <div class="ubalance">${fmtTL(u.balance)}</div>
        </div>`;
      })
      .join('');
  $$('.user-row', el).forEach((r) => r.addEventListener('click', () => renderUserDetail(r.dataset.uid)));
}

async function renderUserDetail(uid) {
  const el = $('#view');
  el.innerHTML = '<div class="spinner">Yükleniyor…</div>';
  const { user, coupons, stats } = await api('/users/' + uid);
  const couponsHtml = coupons.length ? coupons.map(couponCard).join('') : '<div class="empty">Bu oyuncu henüz kupon yapmamış.</div>';

  const adminHtml = ME.is_admin ? `
    <div class="card">
      <h3>⚙️ Admin İşlemleri</h3>
      <div class="bet-field" style="margin-bottom:12px">
        <label>Bakiye düzenle (ASCU)</label>
        <div style="display:flex;gap:8px">
          <input id="adm-balance" type="number" min="0" step="1" value="${Number(user.balance)}" style="flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px;font-size:15px" />
          <button class="btn-sm btn-ok" id="adm-balance-save">Kaydet</button>
        </div>
      </div>
      ${user.id !== ME.id
        ? '<button class="btn-sm btn-no" id="adm-delete">🗑️ Kullanıcıyı Sil</button>'
        : '<div style="color:var(--muted);font-size:12px">(Kendi hesabını silemezsin)</div>'}
    </div>` : '';

  el.innerHTML = `
    <button class="btn-ghost" id="back-btn" style="margin-bottom:14px">← Oyuncular</button>
    <div class="card">
      <h3>${user.username}${user.is_admin ? '<span class="admin-tag">admin</span>' : ''}${user.eliminated ? '<span class="elim-tag">Kaybetti</span>' : ''}</h3>
      <div class="coupon-meta" style="margin:0">
        <span>Bakiye: <b style="color:var(--gold)">${fmtTL(user.balance)}</b></span>
        <span>Toplam kupon: <b>${stats.total}</b></span>
        <span style="color:var(--accent)">Kazanan: <b>${stats.won}</b></span>
        <span style="color:var(--danger)">Kaybeden: <b>${stats.lost}</b></span>
        <span style="color:var(--warn)">Bekleyen: <b>${stats.pending}</b></span>
      </div>
    </div>
    ${adminHtml}
    <div class="section-title">Kuponları</div>
    ${couponsHtml}`;

  $('#back-btn').addEventListener('click', () => render('kullanicilar'));

  if (ME.is_admin) {
    $('#adm-balance-save').addEventListener('click', async () => {
      const balance = Number($('#adm-balance').value);
      if (!Number.isFinite(balance) || balance < 0) return toast('Geçerli bir bakiye girin', true);
      try {
        await api(`/admin/users/${uid}/balance`, { method: 'POST', body: { balance } });
        toast('Bakiye güncellendi ✅');
        if (Number(uid) === ME.id) await refreshMe();
        renderUserDetail(uid);
      } catch (e) { toast(e.message, true); }
    });
    const delBtn = $('#adm-delete');
    if (delBtn) delBtn.addEventListener('click', async () => {
      if (!confirm(`${user.username} kullanıcısı ve tüm kuponları kalıcı olarak silinecek. Emin misin?`)) return;
      try {
        await api(`/admin/users/${uid}/delete`, { method: 'POST' });
        toast('Kullanıcı silindi');
        render('kullanicilar');
      } catch (e) { toast(e.message, true); }
    });
  }
}

// ----- Sonuclar -----
async function renderSonuclar(el) {
  const { matches } = await api('/matches/results');
  if (!matches.length) {
    el.innerHTML = '<div class="empty">Henüz sonuçlanan maç yok.</div>';
    return;
  }
  el.innerHTML =
    `<div class="section-title">Sonuçlar <small>son maçlar</small></div>` +
    matches
      .map((m) => {
        const voided = m.status === 'void';
        const score = voided ? 'İPTAL' : `${m.home_score} - ${m.away_score}`;
        return `<div class="match">
          <div class="fixture">
            <div class="teams-col">
              <div class="team-row">${crestEl(m.home_team)}<span class="team-name">${m.home_team}</span></div>
              <div class="team-row">${crestEl(m.away_team)}<span class="team-name">${m.away_team}</span></div>
            </div>
            <div class="kick" style="font-size:20px;font-weight:800;color:${voided ? 'var(--muted)' : 'var(--pri)'}">${score}</div>
          </div>
          <div class="market-label" style="margin-top:8px">${fmtDate(m.commence_time)}</div>
        </div>`;
      })
      .join('');
}

// ----- Admin -----
async function renderAdmin(el) {
  const [{ pending }, { matches }, resultsResp] = await Promise.all([
    api('/admin/pending'), api('/matches'), api('/matches/results'),
  ]);
  const settledMatches = (resultsResp.matches || []).filter((m) => m.status === 'settled');

  const pendingHtml = pending.length
    ? pending
        .map(
          (u) => `<div class="pending-row">
            <span>${u.username} <small style="color:var(--muted)">${fmtDate(u.created_at)}</small></span>
            <div class="row-actions">
              <button class="btn-sm btn-ok" data-approve="${u.id}">Onayla</button>
              <button class="btn-sm btn-no" data-reject="${u.id}">Reddet</button>
            </div>
          </div>`
        )
        .join('')
    : '<div style="color:var(--muted);font-size:13px">Bekleyen kayıt yok.</div>';

  const matchesHtml = matches.length
    ? matches
        .map(
          (m) => `<div class="pending-row" style="flex-wrap:wrap">
            <span>${m.home_team} vs ${m.away_team} <small style="color:var(--muted)">${fmtDate(m.commence_time)}</small></span>
            <form class="settle-form" data-mid="${m.id}">
              <span style="font-size:11px;color:var(--muted);width:100%">Maç sonu skoru:</span>
              <input type="number" min="0" placeholder="0" class="hs" />
              <span>-</span>
              <input type="number" min="0" placeholder="0" class="as" />
              <span style="font-size:11px;color:var(--muted);width:100%;margin-top:4px">İlk yarı skoru (isteğe bağlı):</span>
              <input type="number" min="0" placeholder="İY" class="ihs" />
              <span>-</span>
              <input type="number" min="0" placeholder="İY" class="ias" />
              <button type="submit" class="btn-sm btn-blue">Sonuçlandır</button>
              <button type="button" class="btn-sm btn-no" data-void="${m.id}">İptal</button>
            </form>
          </div>`
        )
        .join('')
    : '<div style="color:var(--muted);font-size:13px">Açık maç yok.</div>';

  // KURAL 8: Sonuclanan maclarin duzeltilmesi (yeniden sonuclandirma).
  const correctHtml = settledMatches.length
    ? settledMatches
        .map(
          (m) => `<div class="pending-row" style="flex-wrap:wrap">
            <span>${m.home_team} vs ${m.away_team} <small style="color:var(--muted)">şu an: ${m.home_score}-${m.away_score}</small></span>
            <form class="correct-form" data-mid="${m.id}">
              <span style="font-size:11px;color:var(--muted);width:100%">Doğru maç sonu skoru:</span>
              <input type="number" min="0" placeholder="0" class="chs" />
              <span>-</span>
              <input type="number" min="0" placeholder="0" class="cas" />
              <span style="font-size:11px;color:var(--muted);width:100%;margin-top:4px">İlk yarı (isteğe bağlı):</span>
              <input type="number" min="0" placeholder="İY" class="cihs" />
              <span>-</span>
              <input type="number" min="0" placeholder="İY" class="cias" />
              <button type="submit" class="btn-sm btn-blue">Düzelt</button>
            </form>
          </div>`
        )
        .join('')
    : '<div style="color:var(--muted);font-size:13px">Sonuçlanmış maç yok.</div>';

  el.innerHTML = `
    <div class="info-banner">
      <b>Admin paneli.</b> Kullanıcıları onayla, canlı maç/oranları çek, sonuçları işle.
      Canlı veri için sunucuda <code>ODDS_API_KEY</code> tanımlı olmalı; değilse maçları elle sonuçlandırabilirsin.
    </div>

    <div class="card">
      <h3>Bekleyen Üyelikler (${pending.length})</h3>
      <div id="pending-list">${pendingHtml}</div>
    </div>

    <div class="card">
      <h3>Canlı Veri</h3>
      <div class="admin-tools">
        <button class="btn-sm btn-blue" id="refresh-matches">Maçları & Oranları Çek</button>
        <button class="btn-sm btn-blue" id="refresh-results">Sonuçları Çek & Hesapla</button>
      </div>
      <div id="admin-msg" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
    </div>

    <div class="card">
      <h3>Maçları Elle Sonuçlandır</h3>
      <div id="settle-list">${matchesHtml}</div>
    </div>

    <div class="card">
      <h3>✏️ Sonucu Düzelt (Kural 8)</h3>
      <p style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px">
        Yanlış sonuçlanan maçı doğru skorla yeniden hesaplar. Kuponlar yeni skora göre
        tekrar değerlendirilir; katılım cezası (Kural 3) tekrar uygulanmaz.
      </p>
      <div id="correct-list">${correctHtml}</div>
    </div>

    <div class="card">
      <h3>🔄 Sezonu Sıfırla</h3>
      <p style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px">
        Tüm kuponları siler ve <b>herkesin bakiyesini 1.000 ASCU'ya</b> döndürür.
        Kullanıcı hesapları <b>silinmez</b>. Geri alınamaz.
      </p>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px">
        <input type="checkbox" id="reset-matches" /> Sonuçlanan maçları da tekrar bahse aç
      </label>
      <button class="btn-sm btn-no" id="reset-btn">Kuponları & Bakiyeleri Sıfırla</button>
      <div id="reset-msg" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
    </div>`;

  // Onay/Red
  $$('[data-approve]', el).forEach((b) =>
    b.addEventListener('click', async () => {
      await api(`/admin/users/${b.dataset.approve}/approve`, { method: 'POST' });
      toast('Kullanıcı onaylandı ✅');
      render('admin');
    })
  );
  $$('[data-reject]', el).forEach((b) =>
    b.addEventListener('click', async () => {
      await api(`/admin/users/${b.dataset.reject}/reject`, { method: 'POST' });
      toast('Kullanıcı reddedildi');
      render('admin');
    })
  );

  // Canli veri
  $('#refresh-matches').addEventListener('click', async () => {
    const msg = $('#admin-msg');
    msg.textContent = 'Çekiliyor…';
    try {
      const r = await api('/admin/refresh-matches', { method: 'POST' });
      msg.textContent = `${r.count} maç güncellendi.`;
      toast('Maçlar güncellendi ✅');
    } catch (e) {
      msg.textContent = e.message;
    }
  });
  $('#refresh-results').addEventListener('click', async () => {
    const msg = $('#admin-msg');
    msg.textContent = 'Çekiliyor…';
    try {
      const r = await api('/admin/refresh-results', { method: 'POST' });
      let html = `<b>${r.settled}</b> maç doğrulandı ve sonuçlandı.`;
      if (r.fdActive === false) {
        html += ' <span style="color:var(--muted)">(çift doğrulama kapalı — FOOTBALL_DATA_TOKEN eklenmemiş; ilk yarı kuponları iade edildi)</span>';
      }
      if (r.conflicts && r.conflicts.length) {
        html += `<div style="margin-top:10px;background:#fce4ea;border:1px solid #f6d3de;border-radius:8px;padding:10px 12px;color:#9c2c4a">
          <b>⚠️ ${r.conflicts.length} maçta skor doğrulanamadı — aşağıdan elle sonuçlandır:</b>` +
          r.conflicts.map((c) => `<div style="margin-top:6px">• <b>${c.teams}</b><br><span style="font-size:12px">football-data: <b>${c.fd}</b> · Odds API: <b>${c.odds}</b> · <i>${c.reason}</i></span></div>`).join('') +
          `</div>`;
      }
      if (r.fdError) html += `<div style="margin-top:8px;color:var(--danger);font-size:12px">football-data notu: ${r.fdError}</div>`;
      msg.innerHTML = html;
      toast('Sonuçlar işlendi ✅');
      await refreshMe();
    } catch (e) {
      msg.textContent = e.message;
    }
  });

  // Sezonu sifirla
  $('#reset-btn').addEventListener('click', async () => {
    if (!confirm('TÜM kuponlar silinecek ve herkesin bakiyesi 1.000 ASCU olacak. Emin misin?')) return;
    const msg = $('#reset-msg');
    msg.textContent = 'Sıfırlanıyor…';
    try {
      const alsoMatches = $('#reset-matches').checked;
      await api('/admin/reset', { method: 'POST', body: { matches: alsoMatches } });
      toast('Sıfırlandı ✅');
      await refreshMe();
      render('admin');
    } catch (e) {
      msg.textContent = e.message;
    }
  });

  // Elle sonuclandirma
  $$('.settle-form', el).forEach((f) =>
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const hs = Number($('.hs', f).value);
      const as = Number($('.as', f).value);
      if (!Number.isInteger(hs) || !Number.isInteger(as)) return toast('Maç sonu skorunu girin', true);
      const ihv = $('.ihs', f).value, iav = $('.ias', f).value;
      const body = { home_score: hs, away_score: as };
      if (ihv !== '' && iav !== '') { body.ht_home = Number(ihv); body.ht_away = Number(iav); }
      try {
        await api(`/admin/matches/${f.dataset.mid}/settle`, { method: 'POST', body });
        toast('Maç sonuçlandı ✅');
        render('admin');
      } catch (err) {
        toast(err.message, true);
      }
    })
  );
  // KURAL 8: Sonuc duzeltme
  $$('.correct-form', el).forEach((f) =>
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const hs = Number($('.chs', f).value);
      const as = Number($('.cas', f).value);
      if (!Number.isInteger(hs) || !Number.isInteger(as)) return toast('Doğru skoru girin', true);
      const ihv = $('.cihs', f).value, iav = $('.cias', f).value;
      const body = { home_score: hs, away_score: as, correct: true };
      if (ihv !== '' && iav !== '') { body.ht_home = Number(ihv); body.ht_away = Number(iav); }
      if (!confirm('Bu maçın sonucunu düzeltmek istediğine emin misin? Kuponlar yeniden hesaplanacak.')) return;
      try {
        await api(`/admin/matches/${f.dataset.mid}/settle`, { method: 'POST', body });
        toast('Sonuç düzeltildi ✅');
        render('admin');
      } catch (err) {
        toast(err.message, true);
      }
    })
  );
  $$('[data-void]', el).forEach((b) =>
    b.addEventListener('click', async () => {
      try {
        await api(`/admin/matches/${b.dataset.void}/void`, { method: 'POST' });
        toast('Maç iptal edildi, bahisler iade edildi');
        render('admin');
      } catch (err) {
        toast(err.message, true);
      }
    })
  );
}

// ---------- Baslat ----------
boot().catch(() => {
  $('#auth-screen').classList.remove('hidden');
});

</script>
</body>
</html>
